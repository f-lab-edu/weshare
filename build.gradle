plugins {
    id 'java'
    id 'org.springframework.boot' version '3.1.8'
    id 'io.spring.dependency-management' version '1.1.4'
}

subprojects {
    group = 'com.flab'
    version = '0.0.1-SNAPSHOT'
    sourceCompatibility = '17'
    targetCompatibility = '17'

    apply plugin: 'java'
    apply plugin: 'java-library'
    apply plugin: 'org.springframework.boot'
    apply plugin: 'io.spring.dependency-management'

    configurations {
        compileOnly {
            extendsFrom annotationProcessor
        }
    }

    repositories {
        mavenCentral()
    }

    ext["hibernate.version"] = "6.4.0.Final"
    dependencies {
        implementation 'org.springframework.boot:spring-boot-starter-logging'
        implementation 'org.projectlombok:lombok'
        implementation 'org.springframework.boot:spring-boot-configuration-processor'
        testImplementation 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'
        testAnnotationProcessor 'org.projectlombok:lombok'
        runtimeOnly 'com.mysql:mysql-connector-j'
        testImplementation 'org.springframework.boot:spring-boot-starter-test'

        implementation 'com.googlecode.json-simple:json-simple:1.1.1'
        testImplementation 'org.testcontainers:testcontainers:1.19.6'
        testImplementation 'org.testcontainers:junit-jupiter:1.19.6'
        testImplementation 'org.testcontainers:mysql:1.19.6'
        testImplementation 'org.testcontainers:jdbc:1.19.6'
    }

    tasks.named('bootBuildImage') {
        builder = 'paketobuildpacks/builder-jammy-base:latest'
    }


    tasks.named('test') {
        useJUnitPlatform()
    }

    jar {
        enabled = false
    }

}

tasks.register("startDockerDesktop") {
    group = 'docker'
    description = 'Start Docker Desktop on macOS and wait for the daemon to be ready'

    doLast {
        println '🚀 Docker Desktop 실행 중...'
        exec {
            commandLine 'open', '-a', 'Docker'
            ignoreExitValue = true
        }

        // 최대 30초까지 대기하며 docker info 체크
        def maxAttempts = 30
        def attempts = 0

        while (true) {
            def output = new ByteArrayOutputStream()
            def result = exec {
                commandLine 'docker', 'info'
                standardOutput = output
                errorOutput = new ByteArrayOutputStream()
                ignoreExitValue = true
            }

            if (result.exitValue == 0) {
                println '✅ Docker daemon is now running.'
                break
            }

            attempts++
            if (attempts >= maxAttempts) {
                throw new GradleException('❌ Docker daemon failed to start within timeout.')
            }

            println "⏳ Waiting for Docker to be ready... (${attempts}s)"
            sleep(1000)
        }
    }
}


task('dockerUpDBANDREDIS') {
    mustRunAfter("startDockerDesktop")

    doLast {
        println("db,redis up")
        exec {
            commandLine 'docker-compose', 'up', '-d'
        }
    }
}


tasks.register("runapiandmail") {
    dependsOn("startDockerDesktop")
    dependsOn("dockerUpDBANDREDIS")
    dependsOn(":weshare-api:buildAndRun1")
    dependsOn(":weshare-mail:buildAndRun2")

    gradle.taskGraph.whenReady { taskGraph ->
        tasks.findByPath(":weshare-api:buildAndRun1")?.mustRunAfter("dockerUpDBANDREDIS")
        tasks.findByPath(":weshare-mail:buildAndRun2")?.mustRunAfter(":weshare-api:buildAndRun1")
    }
}


project(':weshare-batch') { // 컴파일 시 multi-module-database 로딩
    dependencies {
        compileOnly project(':weshare-core')
        compileOnly project(':weshare-pay')
        compileOnly project(':weshare-mail')
    }
}

project(':weshare-api') {
    dependencies {
        compileOnly project(':weshare-core')
        compileOnly project(':weshare-pay')
    }
}

project(':weshare-core') {
    bootJar { enabled = false }
    jar { enabled = true }
}

project(':weshare-pay') {
    bootJar { enabled = false }
    jar {
        enabled = true
    }
}

project(':weshare-mail') {
    bootJar { enabled = true }
    jar {
        enabled = true
    }
}

