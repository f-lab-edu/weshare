spring:
  config:
    import: optional:file:../.env[.properties]
  mail:
    properties:
      mail:
        debug: true
        smtp:
          connectiontimeout: 5000
          starttls:
            enable: true
            required: true
          auth: false
  data:
    redis:
      host: localhost
      port: 6379

async:
  threadNamePrefix: 'async-thread-'
  corePoolSize: 5
  maxPoolSize: 10
  queueCapacity: 100
  keepAliveSeconds: 30
  
mail:
  host: smtp.gmail.com
  port: 587
  username: ${GMAIL_USER_NAME}
  password: ${GMAIL_PASSWORD}


