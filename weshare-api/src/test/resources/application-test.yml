spring:
  config:
    import: optional:file:../.env[.properties]
  datasource:
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    url: jdbc:tc:mysql:8:///
  data:
    redis:
      host: localhost
      port: 6379

  rabbitmq:
    listener:
      simple:
        auto-startup: false

  cache:
    type: redis

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USER_NAME}
    password: ${GMAIL_PASSWORD}
    properties:
      mail:
        debug: true
        smtp:
          connectiontimeout: 5000
          starttls:
            enable: true
            required: true
          auth: false

  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.MySQL8Dialect
    show-sql: true
    hibernate:
      ddl-auto: none

  sql:
    init:
      schema-locations: classpath:/sql/init.sql
      mode: always

jwt:
  access_expiration_time: ${JWT_ACCESS_EXPIRATION_TIME}
  refresh_expiration_time: ${JWT_REFRESH_EXPIRATION_TIME}
  secret: ${JWT_SECRET}

pay:
  rest_application_id: ${REST_APPLICATION_ID}
  private_key: ${PRIVATE_KEY}

  toss:
    secret_key: ${PAY_TOSS_SECRET_KEY}
    client_key: ${PAY_TOSS_CLIENT_KEY}
    auth_key: ${{PAY_TOSS_AUTH_KEY}


aes:
  password: ${AES_PASSWORD}
  salt: ${AES_SALT}

cache:
  ttl_minutes: ${CACHE_TTL_MINUTES}
