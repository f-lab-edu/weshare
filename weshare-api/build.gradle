plugins {
    id 'com.epages.restdocs-api-spec' version '0.18.2'
}

bootJar {
    from("build/api-spec") {
        into("BOOT-INF/classes/static/swagger")
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

ext['spring-security.version'] = '6.1.7'

dependencies {
    implementation project(':weshare-core')
    implementation project(':weshare-pay')

    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-web'

    implementation 'org.springframework.boot:spring-boot-starter-hateoas:2.6.6'
    testImplementation 'org.springframework.security:spring-security-test'

    implementation 'com.googlecode.json-simple:json-simple:1.1.1'

    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    implementation 'io.jsonwebtoken:jjwt-impl:0.11.5'
    implementation 'io.jsonwebtoken:jjwt-jackson:0.11.5'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    testImplementation 'org.springframework.restdocs:spring-restdocs-mockmvc'
    testImplementation('com.epages:restdocs-api-spec-mockmvc:0.18.2')
}

openapi3 {
    server = 'http://localhost:8082'
    title = 'weshare API'
    description = 'weshare API 명세'
    version = '0.1.0'
    format = 'yaml'
}


task('cleanandopenapi3') {
    dependsOn 'clean'
    finalizedBy 'openapi3'
}

task('buildopenapi3') {
    dependsOn 'cleanandopenapi3'
    finalizedBy 'build'
}

task('buildAndRun') {
    dependsOn 'buildopenapi3'
    finalizedBy 'dockerUp'
}

task('dockerUp', type: Exec) {
    commandLine 'docker-compose', 'up', '-d', '--build'
}


test {
    useJUnitPlatform()
}





